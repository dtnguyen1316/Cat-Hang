<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tính lợi nhuận – Tole</title>
<style>
:root{--bg:#f5f7ff;--card:#fff;--tx:#1e2540;--mut:#7a84a3;--line:#e8ecf7;--pri:#5b6cff;--pri2:#8a5bff;--pos:#12a36b;--neg:#e5484d;--hl:#f0f3ff;
--in:#eaf2ff;--inb:#8fb2ff;--inc:#1b3fa8;--ok:#dcfce7;--okb:#3fbf72;--okc:#14532d}
@media(prefers-color-scheme:dark){:root{--bg:#12152a;--card:#1b2040;--tx:#eef0ff;--mut:#9aa3c7;--line:#2a3158;--pri:#8d9bff;--pri2:#b08cff;--pos:#4ade9f;--neg:#ff7b80;--hl:#242b57;
--in:#1f2f66;--inb:#5f86e8;--inc:#dbe6ff;--ok:#14452e;--okb:#3fbf72;--okc:#c9f7da}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 400px at 10% -10%,#dfe6ff 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#f1e3ff 0,transparent 55%),var(--bg);color:var(--tx);min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 20px rgba(91,108,255,.3)}
h1{font-size:19px;margin:0;font-weight:700}
.cats{display:flex;gap:4px;background:rgba(255,255,255,.2);padding:4px;border-radius:12px}
.cats button{border:0;background:transparent;color:#fff;padding:8px 20px;border-radius:9px;font:inherit;cursor:pointer;font-weight:500}
.cats button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tools{display:flex;gap:12px;align-items:center;color:#fff}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.btn{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;padding:7px 14px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.3)}
.subs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px 0;max-width:1500px;margin:auto}
.subs button{border:1.5px solid var(--line);background:var(--card);color:var(--mut);padding:7px 18px;border-radius:999px;font:inherit;cursor:pointer;font-weight:600}
.subs button.on{border-color:var(--pri);color:var(--pri);background:var(--hl)}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px;padding:14px 24px 18px;max-width:1500px;margin:auto;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.res{order:-1;position:static!important}.subs{padding:10px 12px 0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(60,70,140,.08)}
.res{position:sticky;top:14px}
.res .card{padding:16px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#eef1ff,#f6ecff);color:#1e2540}
.kpi small{color:#6b74a0;display:block}
.kpi b{font-size:22px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;font-size:12px;z-index:1}
.wrap{max-height:none;overflow:visible}
main>.card{overflow:visible}
@media(max-width:1300px){.wrap{overflow-x:auto}main>.card{overflow:hidden}}
tr.g td{background:var(--hl);font-weight:700;color:var(--pri);text-align:left}
tr.g td.r{text-align:center}
tr.g{cursor:pointer;user-select:none}
tr.g:hover td{filter:brightness(.97)}
.arr{display:inline-block;width:18px;font-size:12px}
tr.act td{background:color-mix(in srgb,var(--okb) 9%,transparent)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.q,.res input,input.top{text-align:center;font:inherit;font-weight:700;color:var(--inc);background:var(--in);border:2px solid var(--inb);border-radius:9px;transition:.15s}
input.q{width:72px;padding:6px;font-size:15px}
input.top{width:74px;padding:4px 6px;margin-top:4px;display:block;margin-left:auto;margin-right:auto;font-size:13px}
input.e{width:80px;padding:5px 4px;text-align:center;font:inherit;color:var(--tx);background:transparent;border:1.5px dashed transparent;border-radius:8px;transition:.15s}
tr:hover input.e{border-color:var(--line)}
input.e:focus{outline:none;border:1.5px solid var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
input.e.chg{color:#d9730d;font-weight:700;border-color:#f6c28b;background:color-mix(in srgb,#f59e0b 10%,transparent)}
.mutc{color:var(--mut)}
input.q.has{background:var(--ok);border-color:var(--okb);color:var(--okc)}
input.q:focus,.res input:focus{outline:none;border-color:var(--pri);background:var(--card);color:var(--tx);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
input.q::placeholder{color:var(--inb);font-weight:500}
.res table td,.res table th{padding:6px 4px}
.res td:not(:first-child),.res th:not(:first-child){text-align:center}
.res input{width:100px;padding:5px 6px}
.res h3{margin:16px 0 6px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tot td{font-weight:700;font-size:15px;border-top:2px solid var(--line)}
.mut{color:var(--mut)}
.hide,.col{display:none}

.lotbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 24px 0;max-width:1500px;margin:auto}
.lotl{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--mut)}
.lotbar select{font:inherit;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-weight:600;max-width:220px}
.tb{border:1.5px solid var(--line);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.tb:hover{border-color:var(--pri);color:var(--pri)}
.sp{flex:1}
.bar{padding:10px 12px;border-bottom:1px solid var(--line)}
.bar input{width:100%;padding:8px 12px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
.bar input:focus{outline:none;border-color:var(--pri)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gbs{display:flex;gap:6px}
.gb{font-size:11px;font-weight:600;padding:2px 9px;border:1px solid var(--pri);border-radius:999px;color:var(--pri);background:var(--card);cursor:pointer;white-space:nowrap}
.gb:hover{background:var(--pri);color:#fff}
input.e.mm{width:60px}
.lc.loss{color:var(--neg);font-weight:700;background:color-mix(in srgb,var(--neg) 14%,transparent)}
.lc.low{color:#d97706;font-weight:700;background:color-mix(in srgb,#f59e0b 18%,transparent)}
.thr{width:48px;padding:3px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;font:inherit;text-align:center}
.need{margin:10px 0 0;padding:8px 10px;border:1.5px dashed var(--inb);border-radius:10px;font-size:13px;display:none}
.need .tb{margin-top:6px;display:block}
#mbar{display:none}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:95vw;width:820px}
dialog::backdrop{background:rgba(10,12,30,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px}
#cmpbody{overflow-x:auto}
#cmpbody tr.cur td{background:var(--hl);font-weight:700}
.cmpn{color:var(--mut);font-size:12px;margin:8px 0 0}
@media(max-width:900px){
 #mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);cursor:pointer}
 #mbar span{display:flex;flex-direction:column;align-items:center}
 #mbar small{color:var(--mut);font-size:11px}#mbar b{font-size:14px}
 body{padding-bottom:64px}.lotbar{padding:10px 12px 0}
}
@media print{
 :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#555;--line:#ccc;--pri:#333;--pos:#0a7a4f;--neg:#c00;--hl:#eee;--in:#fff;--inb:#999;--inc:#000;--ok:#fff;--okb:#999;--okc:#000}
 body{background:#fff}
 header{background:none;color:#000;box-shadow:none;padding:6px 0}
 header .tools,.cats,.lotbar,.subs,.bar,#mbar,.gbs,.arr,.need .tb{display:none!important}
 main{display:block;padding:0}.res{position:static}.card{box-shadow:none}
 .wrap{max-height:none;overflow:visible}thead th{position:static}
 tr.noq{display:none!important}tr.col:not(.noq){display:table-row!important}
 input{border:0!important;background:none!important}
}
</style></head><body>
<header>
  <h1>🧵 Tính lợi nhuận Tole</h1>
  <div class="cats" id="cats"></div>
  <div class="tools">

    <button class="btn" id="toggleall">Bung/Thu tất cả</button>
    <button class="btn" id="resetp">Đặt lại giá gốc</button>
    <button class="btn" id="clear">Xóa số đã nhập</button>
  </div>
</header>
<div class="lotbar">

<div class="subs" id="subs"></div>
<main>

    <tbody id="body"></tbody></table></div></div>
  <aside class="res"><div class="card" id="res"></div></aside>
</main>
<div id="mbar"></div>
<dialog id="cmp"><div class="dh"><b>📊 So sánh các lô hàng</b><button class="tb" id="cmpx">Đóng</button></div><div id="cmpbody"></div></dialog>

function fmtField(str,dec){
  const v=String(str).replace(dec?/[^\d,]/g:/\D/g,'');
  let ip=v,dp;
  if(dec){const k=v.indexOf(',');if(k>=0){ip=v.slice(0,k);dp=v.slice(k+1).replace(/,/g,'')}}
  ip=ip.replace(/^0+(?=\d)/,'');
  const ipf=ip?Number(ip).toLocaleString('vi-VN'):(dp!==undefined?'0':'');
  return {display:ipf+(dp!==undefined?','+dp:''),raw:(ip||dp)?(ip||'0')+(dp?'.'+dp:''):''};
}
function fmtInput(t,dec){
  const re=dec?/[\d,]/:/\d/;
  const pos=t.selectionStart==null?t.value.length:t.selectionStart;
  let cnt=0;for(const ch of t.value.slice(0,pos))if(re.test(ch))cnt++;
  const o=fmtField(t.value,dec);t.value=o.display;
  let np=0,c=0;while(np<o.display.length&&c<cnt){if(re.test(o.display[np]))c++;np++}
  try{t.setSelectionRange(np,np)}catch(_){}
  return o.raw;
}

function calcSheet(key,q,f){
  const d=DATA[key],s=st[key]||{},c=s.c||{},p=s.p||{},lv=parseFloat(s.lop),lo=lv>0?lv:null;
  let n=0,rev=0,sew=0;
  d.rows.forEach((r,i)=>{const e=parseFloat(q[i])||0;if(!e)return;
    const qty=(lo||r[1])*e,cv=parseFloat(c[i]),pv=parseFloat(p[i]),cc=isFinite(cv)?cv:r[2],pr=isFinite(pv)?pv:r[3];
    n+=qty;rev+=qty*pr;sew+=qty*cc});
  return {n,rev,sew,pf:(f||d.fabric).map(fv=>rev-sew-(+fv[0]||0)*(+fv[1]||0))};
}

      l.c.forEach((v,i)=>{
        x.font=`${l.head||l.bold?700:400} ${l.head?13:15}px ${F}`;
        x.fillStyle=l.head?'#7a84a3':(i>0&&v.startsWith('-')?'#e5484d':'#1e2540');
        if(i===0){x.textAlign='left';x.fillText(v,P,y+22)}else{x.textAlign='center';x.fillText(v,P+lw+cw*(i-1)+cw/2,y+22)}
      });
    }
    y+=h;
  });
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='loi-nhuan-tole.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});
};

/* ---------- Tab ---------- */
function renderTabs(){
  $('#cats').innerHTML=CATS.map(c=>`<button class="${c==cur().cat?'on':''}" data-c="${c}">${c}</button>`).join('');
  const ks=KEYS.filter(k=>DATA[k].cat==cur().cat);
  $('#subs').style.display=ks.length>1?'flex':'none';
  $('#subs').innerHTML=ks.map(k=>`<button class="${k==sheet?'on':''}" data-k="${k}">${DATA[k].label}</button>`).join('');
}
function go(k){sheet=k;st.__last=k;save();renderAll()}
$('#cats').onclick=e=>{const c=e.target.dataset.c;if(c)go(KEYS.find(k=>DATA[k].cat==c))};
$('#subs').onclick=e=>{const k=e.target.dataset.k;if(k)go(k)};

function renderTable(){
  const d=cur(),rows=d.rows,s=S(),q=s.q,gi=GI(rows),grouped=!d.flat;let html='',last=null;
  rows.forEach((r,i)=>{
    const g=gi[i];
    if(grouped&&g!==last){last=g;
      html+=`<tr class="g" data-g="${g}"><td colspan="8"><div class="gh"><span><span class="arr"></span>${gname(r)}</span><span class="gbs"><span class="gb" data-act="p" title="Cộng/trừ Giá bán/bộ cho cả mục">Giá ±</span><span class="gb" data-act="c" title="Cộng/trừ Chi phí/bộ cho cả mục">CP ±</span><span class="gb" data-act="m" title="Đặt Vải/bộ cho cả mục">Vải/bộ =</span></span></div></td><td class="r" id="gq-${g}"></td><td class="r" id="gp-${g}"></td></tr>`}
    html+=`<tr data-i="${i}" data-g="${g}"><td>${r[0]}</td><td class="mutc" id="l${i}"></td>
    <td><input class="e${s.c[i]!==undefined&&s.c[i]!==''?' chg':''}" type="text" inputmode="numeric" data-e="c" data-i="${i}" value="${fmtI(s.c[i]??r[2])}"></td>
    <td><input class="e${s.p[i]!==undefined&&s.p[i]!==''?' chg':''}" type="text" inputmode="numeric" data-e="p" data-i="${i}" value="${fmtI(s.p[i]??r[3])}"></td>
    <td><input class="e mm" type="text" inputmode="decimal" data-e="m" data-i="${i}" value="${fmtD(s.m[i])}" placeholder="0"></td>
    <td id="lb${i}"></td><td id="lp${i}"></td>
    <td><input class="q" type="number" min="0" step="any" inputmode="decimal" data-i="${i}" value="${q[i]??''}" placeholder="0"></td>
    <td id="n${i}"></td><td id="p${i}"></td></tr>`;
  });
  $('#body').innerHTML=html;$('#lop').value=s.lop;
}
function renderRes(){
  const f=fab(),adj=S().adj,N=f.length,I=[...Array(N).keys()];
  const cells=k=>I.map(i=>`<td id="r-${k}${i}"></td>`).join('');
  const inp=k=>I.map(i=>`<td><input type="text" inputmode="${k===0?'decimal':'numeric'}" data-f="${i}" data-k="${k}" value="${fmtD(f[i][k])}"></td>`).join('');
  const head=`<tr><th></th>${I.map(i=>`<th>Phương án ${i+1}</th>`).join('')}</tr>`;
  const row=(l,k,c)=>`<tr${c==='tot'?' class="tot"':''}><td${c==='m'?' class="mut"':''}>${l}</td>${cells(k)}</tr>`;
  $('#res').innerHTML=`
  <div class="big"><div class="kpi"><small>Tổng số bộ</small><b id="k-n">0</b></div>
  <div class="kpi"><small>Doanh thu</small><b id="k-rev">0</b></div></div>
  <table><thead>${head}</thead><tbody>
  <tr><td>Số lượng vải</td>${inp(0)}</tr>
  <tr><td>Đơn giá vải</td>${inp(1)}</tr>
  ${row('Tiền vải','fab','m')}${row('Chi phí may','sew','m')}${row('Tổng chi phí','cost','m')}
  ${row('LỢI NHUẬN','pf','tot')}${row('Lời 1 bộ','pu')}${row('Tỷ suất (%)','pc')}</tbody></table>
  <div class="need" id="need"></div>
  <h3>Giá bán chênh lệch <input type="text" inputmode="numeric" id="adj" value="${fmtD(adj)}"> đ/bộ</h3>
  <table><thead>${head}</thead><tbody>
  ${row('Giá bán <b>+</b> → Lợi nhuận','ap')}${row('Lời 1 bộ','apu','m')}${row('Tỷ suất (%)','apc','m')}
  ${row('Giá bán <b>−</b> → Lợi nhuận','am')}${row('Lời 1 bộ','amu','m')}${row('Tỷ suất (%)','amc','m')}</tbody></table>`;
}
function calc(){
  const d=cur(),rows=d.rows,s=S(),q=s.q,f=fab(),adj=+s.adj||0,gi=GI(rows),thr=+st.__thr||0,p1=+f[0][1]||0;
  let n=0,rev=0,sew=0,need=0;const gq={},gp={};
  rows.forEach((r,i)=>{
    const e=parseFloat(q[i])||0,lop=LOP(i),qty=lop*e,c=COST(i),pr=PRICE(i),p=(pr-c)*qty,g=gi[i],m=parseFloat(s.m[i])||0;
    n+=qty;rev+=qty*pr;sew+=qty*c;need+=qty*m;
    $('#l'+i).textContent=lop;
    $('#n'+i).textContent=qty?fmt(qty):'';$('#p'+i).textContent=qty?fmt(p):'';
    const uc=c+m*p1,lb=pr-uc,pc=uc?lb/uc*100:null,k=lb<0?'loss':(pc!=null&&pc<thr?'low':'');
    const a=$('#lb'+i),b=$('#lp'+i);
    a.textContent=fmt(lb);b.textContent=pc==null?'—':pc.toFixed(1);a.className=b.className='lc '+k;
    const tr=$(`tr[data-i="${i}"]`);tr.classList.toggle('act',e>0);tr.classList.toggle('noq',!(e>0));tr.querySelector('input.q').classList.toggle('has',e>0);
    gq[g]=(gq[g]||0)+qty;gp[g]=(gp[g]||0)+p;
  });
  if(!d.flat)for(const g in gq){
    $('#gq-'+g).textContent=gq[g]?fmt(gq[g])+' bộ':'';$('#gp-'+g).textContent=gp[g]?fmt(gp[g]):'';
    $(`tr.g[data-g="${g}"]`).classList.toggle('noq',!gq[g]);
  }
  $('#k-n').textContent=fmt(n);$('#k-rev').textContent=fmt(rev);
  const set=(k,i,v,c)=>{const e=$(`#r-${k}${i}`);if(!e)return;e.textContent=v;e.className=c||''};
  const pct=(p,den)=>den?(p/den*100).toFixed(1):'—';
  const pfs=[];
  f.forEach((fv,i)=>{
    const fb=(+fv[0]||0)*(+fv[1]||0),cost=fb+sew,pf=rev-cost;pfs.push(pf);
    set('fab',i,fmt(fb));set('sew',i,fmt(sew));set('cost',i,fmt(cost));
    set('pf',i,fmt(pf),cls(pf));$(`#r-pf${i}`).style.fontWeight=700;
    set('pu',i,n?fmt(pf/n):'—');set('pc',i,pct(pf,cost));
    const pa=pf+n*adj,pm=pf-n*adj;
    set('ap',i,fmt(pa),cls(pa));set('apu',i,n?fmt(pa/n):'—');set('apc',i,pct(pa,cost));
    set('am',i,fmt(pm),cls(pm));set('amu',i,n?fmt(pm/n):'—');set('amc',i,pct(pm,cost));
  });
  lastNeed=Math.round(need*100)/100;
  const nd=$('#need');
  if(lastNeed>0){nd.innerHTML=`Vải cần theo định mức: <b>${fmtD(lastNeed)}</b><button class="tb" id="applyneed">Áp dụng vào Số lượng vải</button>`;nd.style.display='block'}
  else{nd.innerHTML='';nd.style.display='none'}
  $('#mbar').innerHTML=`<span><small>Tổng bộ</small><b>${fmt(n)}</b></span>`+pfs.map((v,i)=>`<span><small>Lợi nhuận PA${i+1}</small><b class="${cls(v)}">${fmt(v)}</b></span>`).join('');
  filter();
}
function filter(){
  const on=$('#only').checked,d=cur(),open=S().open,qv=norm($('#search').value||'');
  const ent=tr=>parseFloat(S().q[tr.dataset.i])>0;
  document.querySelectorAll('#body tr:not(.g)').forEach(tr=>{
    const hide=(on&&!ent(tr))||(qv&&!norm(d.rows[tr.dataset.i][0]).includes(qv));
    tr.classList.toggle('hide',!!hide);
    tr.classList.toggle('col',!d.flat&&!on&&!qv&&!open[tr.dataset.g]);
  });
  document.querySelectorAll('#body tr.g').forEach(tr=>{
    const g=tr.dataset.g;
    const any=[...document.querySelectorAll(`#body tr[data-g="${g}"]:not(.g)`)].some(r=>!r.classList.contains('hide'));
    tr.classList.toggle('hide',!any);
    tr.querySelector('.arr').textContent=(on||qv||open[g])?'▾':'▸';
  });
}
function renderAll(){renderLots();renderTabs();renderTable();renderRes();calc()}

/* ---------- Sự kiện ---------- */
document.addEventListener('input',e=>{
  const t=e.target,s=S();
  if(t.classList.contains('q'))s.q[t.dataset.i]=t.value;
  else if(t.dataset.f!==undefined)fab()[t.dataset.f][+t.dataset.k]=fmtInput(t,t.dataset.k==='0');
  else if(t.id==='adj')s.adj=fmtInput(t,false);
  else if(t.id==='lop')s.lop=t.value;
  else if(t.dataset.e){const k=t.dataset.e,raw=fmtInput(t,k==='m'),m=k==='c'?s.c:k==='p'?s.p:s.m;
    if(raw==='')delete m[t.dataset.i];else m[t.dataset.i]=raw;
    if(k!=='m'){const r=cur().rows[t.dataset.i],orig=k==='c'?r[2]:r[3];t.classList.toggle('chg',raw!==''&&+raw!==orig)}}
  else return;
  save();calc();
});
document.addEventListener('focusin',e=>{if(e.target.matches('input.q,input.e,.res input'))e.target.select()});
document.addEventListener('keydown',e=>{
  if(!e.target.classList.contains('q'))return;
  const all=[...document.querySelectorAll('input.q')].filter(x=>x.offsetParent),i=all.indexOf(e.target);
  if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();(all[i+1]||e.target).focus()}
  if(e.key==='ArrowUp'){e.preventDefault();(all[i-1]||e.target).focus()}
});
document.addEventListener('focusout',e=>{const t=e.target;
  if(t.dataset&&(t.dataset.e==='c'||t.dataset.e==='p')&&t.value===''){const r=cur().rows[t.dataset.i];t.value=fmtI(t.dataset.e==='c'?r[2]:r[3]);t.classList.remove('chg')}});

function bulk(gb){
  const d=cur(),s=S(),gi=GI(d.rows),g=+gb.closest('tr.g').dataset.g,idx=gi.map((x,i)=>x===g?i:-1).filter(i=>i>=0),name=gname(d.rows[idx[0]]),act=gb.dataset.act;
  if(act==='m'){
    const v=prompt(`Đặt Vải/bộ cho cả mục "${name}" (${idx.length} size).\nCùng đơn vị với "Số lượng vải". Để trống = xóa định mức.`,'');
    if(v===null)return;
    if(!v.trim())idx.forEach(i=>delete s.m[i]);
    else{const x=parseDec(v);if(!isFinite(x)||x<0){alert('Số không hợp lệ.');return}idx.forEach(i=>s.m[i]=String(x))}
  }else{
    const lbl=act==='p'?'Giá bán/bộ':'Chi phí/bộ';
    const v=prompt(`Cộng/trừ ${lbl} cho cả mục "${name}" (${idx.length} size).\nNhập số, âm để giảm. Ví dụ: 1000 hoặc -500`,'1000');
    if(v===null)return;
    const x=parseMoney(v);if(!isFinite(x)||!x)return;
    idx.forEach(i=>{const base=act==='p'?PRICE(i):COST(i);(act==='p'?s.p:s.c)[i]=String(Math.max(0,base+x))});
  }
  save();renderTable();calc();
}
document.addEventListener('click',e=>{
  if(e.target.closest('#applyneed')){fab().forEach(fv=>fv[0]=String(lastNeed));save();renderRes();calc();return}
  if(e.target.closest('#mbar')){window.scrollTo({top:0,behavior:'smooth'});return}
  const gb=e.target.closest('.gb');if(gb){bulk(gb);return}
  const tr=e.target.closest('tr.g');if(!tr)return;
  const o=S().open,g=tr.dataset.g;o[g]=!o[g];save();filter();
});
$('#toggleall').onclick=()=>{const gs=[...new Set(GI(cur().rows))],o=S().open,allOpen=gs.every(g=>o[g]);
  gs.forEach(g=>o[g]=!allOpen);save();filter()};
$('#only').onchange=filter;
$('#search').oninput=filter;
$('#thr').value=st.__thr;
$('#thr').oninput=e=>{st.__thr=+e.target.value||0;save();calc()};
$('#resetp').onclick=()=>{const s=S();s.c={};s.p={};s.lop='';save();renderTable();calc()};
$('#clear').onclick=()=>{
  const d=cur(),s=S(),gi=GI(d.rows),open=s.open;let idx=d.rows.map((_,i)=>i),label;
  if(d.flat)label='tất cả loại đồ';
  else{const gs=[...new Set(gi)].filter(g=>open[g]);
    if(gs.length){idx=idx.filter(i=>open[gi[i]]);label='các mục đang mở: '+gs.map(g=>gname(d.rows[gi.indexOf(g)])).join(', ')}
    else label='toàn bộ tab (chưa có mục nào đang mở)'}
  const n=idx.filter(i=>parseFloat(s.q[i])>0).length;
  if(!n){alert('Không có số nào để xóa.');return}
  if(confirm(`Xóa số "Xuất hiện" của ${label} (${n} dòng)?`)){idx.forEach(i=>delete s.q[i]);save();renderTable();calc()}
};
renderAll();
</script></body></html>
