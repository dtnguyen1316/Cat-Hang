<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tính lợi nhuận – Tole</title>
<style>
:root{--bg:#f5f7ff;--card:#fff;--tx:#1e2540;--mut:#7a84a3;--line:#e8ecf7;--pri:#5b6cff;--pri2:#8a5bff;--pos:#12a36b;--neg:#e5484d;--hl:#f0f3ff;

*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 400px at 10% -10%,#dfe6ff 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#f1e3ff 0,transparent 55%),var(--bg);color:var(--tx);min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 20px rgba(91,108,255,.3)}
h1{font-size:19px;margin:0;font-weight:700}
.cats{display:flex;gap:4px;background:rgba(255,255,255,.2);padding:4px;border-radius:12px}
.cats button{border:0;background:transparent;color:#fff;padding:8px 20px;border-radius:9px;font:inherit;cursor:pointer;font-weight:500}
.cats button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tools{display:flex;gap:12px;align-items:center;color:#fff}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.btn{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;padding:7px 14px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.3)}
.subs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px 0;max-width:1350px;margin:auto}
.subs button{border:1.5px solid var(--line);background:var(--card);color:var(--mut);padding:7px 18px;border-radius:999px;font:inherit;cursor:pointer;font-weight:600}
.subs button.on{border-color:var(--pri);color:var(--pri);background:var(--hl)}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:18px;padding:14px 24px 18px;max-width:1350px;margin:auto;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.res{order:-1;position:static!important}.subs{padding:10px 12px 0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(60,70,140,.08)}
.res{position:sticky;top:14px}
.res .card{padding:16px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,#eef1ff,#f6ecff);color:#1e2540}
.kpi small{color:#6b74a0;display:block}
.kpi b{font-size:22px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--card);color:var(--mut);font-weight:600;font-size:12px;z-index:1}
.wrap{max-height:none;overflow:visible}
main>.card{overflow:visible}
@media(max-width:900px){.wrap{overflow-x:auto}main>.card{overflow:hidden}}
tr.g td{background:var(--hl);font-weight:700;color:var(--pri);text-align:left}
tr.g td.r{text-align:center}
tr.g{cursor:pointer;user-select:none}
tr.g:hover td{filter:brightness(.97)}
.arr{display:inline-block;width:18px;font-size:12px}
tr.act td{background:color-mix(in srgb,var(--okb) 9%,transparent)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.q,.res input,input.top{text-align:center;font:inherit;font-weight:700;color:var(--inc);background:var(--in);border:2px solid var(--inb);border-radius:9px;transition:.15s}
input.q{width:80px;padding:6px;font-size:15px}
input.top{width:74px;padding:4px 6px;margin-top:4px;display:block;margin-left:auto;margin-right:auto;font-size:13px}
input.e{width:88px;padding:5px 4px;text-align:center;font:inherit;color:var(--tx);background:transparent;border:1.5px dashed transparent;border-radius:8px;transition:.15s}
input.e.ll{width:56px}
tr:hover input.e{border-color:var(--line)}
input.e:focus{outline:none;border:1.5px solid var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
input.e.chg{color:#d9730d;font-weight:700;border-color:#f6c28b;background:color-mix(in srgb,#f59e0b 10%,transparent)}
.mutc{color:var(--mut)}
input.q.has{background:var(--ok);border-color:var(--okb);color:var(--okc)}
input.q:focus,.res input:focus{outline:none;border-color:var(--pri);background:var(--card);color:var(--tx);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 25%,transparent)}
input.q::placeholder{color:var(--inb);font-weight:500}
.res table td,.res table th{padding:6px 4px}
.res td:not(:first-child),.res th:not(:first-child){text-align:center}
.res input{width:100px;padding:5px 6px}
.res h3{margin:16px 0 6px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tot td{font-weight:700;font-size:15px;border-top:2px solid var(--line)}
.mut{color:var(--mut)}
.hide{display:none}

function renderRes(){
  const d=cur(),f=fab(),adj=S().adj,be=d.type==='be',N=f.length,I=[...Array(N).keys()];
  const cells=k=>I.map(i=>`<td id="r-${k}${i}"></td>`).join('');
  const inp=(k)=>I.map(i=>`<td><input type="number" data-f="${i}" data-k="${k}" value="${f[i][k]}"></td>`).join('');
  const head=`<tr><th></th>${I.map(i=>`<th>${be?'Phương án '+(i+1):'Kết quả'}</th>`).join('')}</tr>`;
  const row=(l,k,c)=>`<tr${c==='tot'?' class="tot"':''}><td${c==='m'?' class="mut"':''}>${l}</td>${cells(k)}</tr>`;
  $('#res').innerHTML=`
  <div class="big"><div class="kpi"><small>Tổng số bộ</small><b id="k-n">0</b></div>
  <div class="kpi"><small>${be?'Doanh thu':'Tổng hàng bán'}</small><b id="k-rev">0</b></div></div>
  <table><thead>${head}</thead><tbody>
  <tr><td>Số lượng vải</td>${inp(0)}</tr>
  <tr><td>Đơn giá vải</td>${inp(1)}</tr>
  ${row('Tiền vải','fab','m')}
  ${be?row('Chi phí may','sew','m')+row('Tổng chi phí','cost','m'):row('Tổng hàng bán','hang','m')}
  ${row('LỢI NHUẬN','pf','tot')}${row('Lời 1 bộ','pu')}${row('Tỷ suất (%)','pc')}</tbody></table>
  <h3>Giá bán chênh lệch <input type="number" id="adj" value="${adj}"> đ/bộ</h3>
  <table><thead>${head}</thead><tbody>
  ${row('Giá bán <b>+</b> → Lợi nhuận','ap')}${row('Lời 1 bộ','apu','m')}${row('Tỷ suất (%)','apc','m')}
  ${row('Giá bán <b>−</b> → Lợi nhuận','am')}${row('Lời 1 bộ','amu','m')}${row('Tỷ suất (%)','amc','m')}</tbody></table>`;
}
function calc(){
  const d=cur(),rows=d.rows,q=S().q,f=fab(),adj=+S().adj||0,be=d.type==='be',gi=GI(rows);
  let n=0,rev=0,sew=0;const gq={},gp={};
  rows.forEach((r,i)=>{
    const e=parseFloat(q[i])||0,qty=LOP(i)*e,c=COST(i),pr=PRICE(i),p=(pr-c)*qty,g=gi[i];
    n+=qty;rev+=qty*pr;sew+=qty*c;
    $('#n'+i).textContent=qty?fmt(qty):'';$('#p'+i).textContent=qty?fmt(p):'';
    const tr=$(`tr[data-i="${i}"]`);tr.classList.toggle('act',e>0);tr.querySelector('input.q').classList.toggle('has',e>0);
    gq[g]=(gq[g]||0)+qty;gp[g]=(gp[g]||0)+p;
  });
  if(be&&!d.flat)for(const g in gq){$('#gq-'+g).textContent=gq[g]?fmt(gq[g])+' bộ':'';$('#gp-'+g).textContent=gp[g]?fmt(gp[g]):''}
  const hang=rev-sew;
  $('#k-n').textContent=fmt(n);$('#k-rev').textContent=fmt(be?rev:hang);
  const set=(k,i,v,c)=>{const e=$(`#r-${k}${i}`);if(!e)return;e.textContent=v;e.className=c||''};
  const pct=(p,den)=>den?(p/den*100).toFixed(1):'—';
  f.forEach((fv,i)=>{
    const fb=(+fv[0]||0)*(+fv[1]||0),cost=fb+sew;
    const pf=be?rev-cost:hang-fb,den=be?cost:hang;
    set('fab',i,fmt(fb));
    if(be){set('sew',i,fmt(sew));set('cost',i,fmt(cost))}else set('hang',i,fmt(hang));
    set('pf',i,fmt(pf),cls(pf));$(`#r-pf${i}`).style.fontWeight=700;
    set('pu',i,n?fmt(pf/n):'—');set('pc',i,pct(pf,den));
    const pa=pf+n*adj,pm=pf-n*adj,da=be?den:den+n*adj,dm=be?den:den-n*adj;
    set('ap',i,fmt(pa),cls(pa));set('apu',i,n?fmt(pa/n):'—');set('apc',i,pct(pa,da));
    set('am',i,fmt(pm),cls(pm));set('amu',i,n?fmt(pm/n):'—');set('amc',i,pct(pm,dm));
  });
  filter();
}
function filter(){
  const on=$('#only').checked,d=cur(),open=S().open;
  const ent=tr=>parseFloat(S().q[tr.dataset.i])>0;
  document.querySelectorAll('#body tr:not(.g)').forEach(tr=>{
    const collapsed=!d.flat&&!on&&!open[tr.dataset.g];
    tr.classList.toggle('hide',(on&&!ent(tr))||collapsed);
  });
  document.querySelectorAll('#body tr.g').forEach(tr=>{
    const g=tr.dataset.g;
    const any=[...document.querySelectorAll(`#body tr[data-g="${g}"]:not(.g)`)].some(r=>!on||ent(r));
    tr.classList.toggle('hide',!any);
    tr.querySelector('.arr').textContent=(on||open[g])?'▾':'▸';
  });
}
function renderAll(){renderTabs();renderTable();renderRes();calc()}
document.addEventListener('input',e=>{
  const t=e.target,s=S();
  if(t.classList.contains('q'))s.q[t.dataset.i]=t.value;
  else if(t.dataset.f!==undefined)fab()[t.dataset.f][t.dataset.k]=t.value;
  else if(t.id==='adj')s.adj=t.value;
  else if(t.id==='lop'){s.lop=t.value;s.l={};document.querySelectorAll('input[data-e="l"]').forEach(x=>{x.value=fmtI(BASEL(+x.dataset.i));x.classList.remove('chg')})}
  else if(t.dataset.e){const m=t.dataset.e==='c'?s.c:t.dataset.e==='l'?s.l:s.p;
    const pos=t.selectionStart,digitsBefore=t.value.slice(0,pos).replace(/\D/g,'').length;
    const raw=t.value.replace(/\D/g,'');
    t.value=raw?(+raw).toLocaleString('vi-VN'):'';
    let np=0,c=0;while(np<t.value.length&&c<digitsBefore){if(/\d/.test(t.value[np]))c++;np++}
    try{t.setSelectionRange(np,np)}catch(_){}
    if(raw==='')delete m[t.dataset.i];else m[t.dataset.i]=raw;
    const r=cur().rows[t.dataset.i],orig=t.dataset.e==='c'?r[2]:t.dataset.e==='l'?BASEL(t.dataset.i):r[3];
    t.classList.toggle('chg',raw!==''&&+raw!==orig);}
  else return;
  save();calc();
});
document.addEventListener('focusin',e=>{if(e.target.matches('input.q,input.e'))e.target.select()});
document.addEventListener('keydown',e=>{
  if(!e.target.classList.contains('q'))return;
  const all=[...document.querySelectorAll('input.q')].filter(x=>x.offsetParent),i=all.indexOf(e.target);
  if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();(all[i+1]||e.target).focus()}
  if(e.key==='ArrowUp'){e.preventDefault();(all[i-1]||e.target).focus()}
});
document.addEventListener('focusout',e=>{const t=e.target;
  if(t.dataset&&t.dataset.e&&t.value===''){const r=cur().rows[t.dataset.i];t.value=fmtI(t.dataset.e==='c'?r[2]:t.dataset.e==='l'?BASEL(t.dataset.i):r[3]);t.classList.remove('chg')}});
$('#only').onchange=filter;
document.addEventListener('click',e=>{const tr=e.target.closest('tr.g');if(!tr)return;
  const o=S().open,g=tr.dataset.g;o[g]=!o[g];save();filter()});
$('#toggleall').onclick=()=>{const gs=[...new Set(GI(cur().rows))],o=S().open,allOpen=gs.every(g=>o[g]);
  gs.forEach(g=>o[g]=!allOpen);save();filter()};
$('#resetp').onclick=()=>{const s=S();s.c={};s.p={};s.l={};s.lop='';save();renderTable();calc()};
$('#clear').onclick=()=>{if(confirm(`Xóa toàn bộ số "Xuất hiện" của ${cur().cat} – ${cur().label}?`)){S().q={};save();renderTable();calc()}};
renderAll();
</script></body></html>
